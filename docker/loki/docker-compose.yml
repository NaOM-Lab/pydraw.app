version: '3.8'

services:
  loki:
    image: grafana/loki:2.9.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    volumes:
      - ./local-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    user: "10001:10001"
    environment:
      - LOKI_USER=10001
      - LOKI_GROUP=10001
    restart: unless-stopped

volumes:
  loki-data: 