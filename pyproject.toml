[tool.poetry]
name = "diagrams-webui"
version = "0.1"
description = "pyDraw - A web UI extending the diagrams library."
license = "No license granted"
authors = ["NāOM Lab LLC <pydraw@naomlab.com>"]
homepage = "https://pydraw.app"
include = ["resources/**/*"]

[tool.poetry.scripts]
diagrams="diagrams.cli:main"

[tool.poetry.dependencies]
python = "^3.9"
graphviz = ">=0.13.2,<0.21.0"
jinja2 = ">=2.10,<4.0"
typed-ast = {version="^1.5.5", markers="python_version<'3.8'"}
pre-commit = "^4.0.1"
flask = "^3.0"
diagrams = "^0.24.4"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^8.3"
pylint = "^3.3"
rope = "^1.13"
isort = "^5.13"
black = "^24.4"

[tool.black]
line-length=120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
